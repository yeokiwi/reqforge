name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: reqforge
          POSTGRES_PASSWORD: reqforge
          POSTGRES_DB: reqforge
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U reqforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://reqforge:reqforge@localhost:5432/reqforge?schema=public
      SESSION_SECRET: ci-session-secret-ci-session-secret

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm exec prisma migrate deploy
      - run: pnpm db:seed
      - run: pnpm verify

  e2e:
    runs-on: ubuntu-latest
    needs: verify

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: reqforge
          POSTGRES_PASSWORD: reqforge
          POSTGRES_DB: reqforge
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U reqforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://reqforge:reqforge@localhost:5432/reqforge?schema=public
      SESSION_SECRET: ci-session-secret-ci-session-secret

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm exec prisma migrate deploy
      - run: pnpm db:seed
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
